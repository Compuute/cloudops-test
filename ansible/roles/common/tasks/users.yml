---
- name: Create deploy group
  ansible.builtin.group:
    name: "{{ deploy_group }}"
    state: present

- name: Create deploy user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    groups: sudo
    shell: /bin/bash
    home: "/home/{{ deploy_user }}"
    create_home: true
    state: present

- name: Ensure authorized_keys directory exists
  ansible.builtin.file:
    path: "{{ deploy_ssh_keys_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy SSH public key for deploy user
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ vault_deploy_ssh_public_key }}"
    state: present
    path: "{{ deploy_ssh_keys_dir }}/{{ deploy_user }}"
    exclusive: true

- name: Allow deploy user passwordless sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/deploy
    content: "{{ deploy_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

- name: Create app and storage directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0755"
  loop:
    - "{{ app_dir }}"
    - "{{ app_storage_dir }}"
    - "{{ backup_dir }}"
